<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="840" role="img" aria-label="future@github 终端自我介绍">
  <style>
    /* 打字机动画：每 ~9s 循环重打一次自我介绍行；负延迟保证加载时已处于"打字中/完成"状态 */
    @keyframes typing {
      0%   { width: 0; }
      28%  { width: 360px; }
      100% { width: 360px; }
    }
    #typeMask {
      animation: typing 9s steps(30, end) infinite;
      animation-delay: -3.5s;
    }
    /* 光标闪烁 */
    @keyframes blink {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cur { animation: blink 1.15s steps(1) infinite; }
  </style>

  <defs>
    <clipPath id="typeClip">
      <rect id="typeMask" x="28" y="83" width="360" height="21" />
    </clipPath>
  </defs>

  <!-- 终端窗口外框 -->
  <rect x="0.5" y="0.5" width="819" height="299" rx="10" fill="#0d1117" stroke="#30363d" />
  <!-- 标题栏 -->
  <rect x="1" y="1" width="818" height="37" rx="9" fill="#161b22" />
  <circle cx="24" cy="19.5" r="5.5" fill="#ff5f56" />
  <circle cx="40" cy="19.5" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="19.5" r="5.5" fill="#27c93f" />
  <text x="112" y="24" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="12.5" fill="#8b949e">future@github — zsh</text>
  <line x1="1" y1="38" x2="819" y2="38" stroke="#21262d" />

  <!-- 终端内容 -->
  <g font-family="Menlo, Monaco, 'Courier New', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15.5">
    <!-- L0: whoami -->
    <text x="28" y="66">
      <tspan fill="#39C5BB">future@github</tspan><tspan fill="#8b949e"> ~ % </tspan><tspan fill="#e6edf3">whoami</tspan>
    </text>
    <!-- L1: 打字动画输出行 -->
    <text x="28" y="96" fill="#39C5BB" clip-path="url(#typeClip)">future — 自动化 / RPA / 数据采集爱好者</text>

    <!-- L2: cat about.txt -->
    <text x="28" y="126">
      <tspan fill="#39C5BB">future@github</tspan><tspan fill="#8b949e"> ~ % </tspan><tspan fill="#e6edf3">cat about.txt</tspan>
    </text>
    <text x="28" y="156" fill="#e6edf3">把重复劳动交给脚本，把时间留给创造。</text>
    <text x="28" y="186" fill="#8b949e">一期一会，每次相遇都是独一无二。</text>

    <!-- L5: ls projects -->
    <text x="28" y="216">
      <tspan fill="#39C5BB">future@github</tspan><tspan fill="#8b949e"> ~ % </tspan><tspan fill="#e6edf3">ls projects/</tspan>
    </text>
    <text x="28" y="246" fill="#79c0ff" xml:space="preserve">scc-automation&#160;&#160;&#160;automa-playground&#160;&#160;&#160;jla-extension&#160;&#160;&#160;u30-stack</text>

    <!-- L7: 等待输入的 prompt + 闪烁光标 -->
    <text x="28" y="278">
      <tspan fill="#39C5BB">future@github</tspan><tspan fill="#8b949e"> ~ % </tspan>
    </text>
    <rect class="cur" x="198" y="264" width="8.6" height="16" rx="1.5" fill="#39C5BB" />
  </g>
</svg>
